services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidgrab-api
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      ALLOWED_ORIGINS: '["https://vidgrab.sunandyu.top"]'
    volumes:
      - ./backend/downloads:/app/downloads
      - ./backend/models:/app/models
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2.8-alpine
    container_name: vidgrab-caddy
    restart: unless-stopped
    depends_on:
      - api
    profiles:
      - standalone-caddy
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  caddy_data:
  caddy_config:
