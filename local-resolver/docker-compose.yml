services:
  local-resolver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidgrab-local-resolver
    restart: unless-stopped
    environment:
      RESOLVER_API_TOKEN: ${RESOLVER_API_TOKEN:-}
    ports:
      - "61337:61337"
    volumes:
      - ./downloads:/app/downloads

  frpc:
    image: snowdreamtech/frpc:0.61.2
    container_name: vidgrab-frpc
    restart: unless-stopped
    command: ["-c", "/etc/frp/frpc.toml"]
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    network_mode: "host"
